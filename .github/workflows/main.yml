name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 1.2.0（带不带 v 都行）"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: DIEditor
  PROJECT: DIEditor/DIEditor.csproj
  # 必须与 csproj 的 <TargetFramework> 主版本一致
  DOTNET_VERSION: "10.0.x"
  # Inno Setup 版本，release tag 自动推导（7.1.1 → is-7_1_1）
  INNO_VERSION: "7.1.1"

jobs:
  # ─────────── 1. 版本号 + 工程定位 ───────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      numversion: ${{ steps.ver.outputs.numversion }}
      tag: ${{ steps.ver.outputs.tag }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
      project: ${{ steps.find.outputs.project }}
      platforms: ${{ steps.find.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RAW="$INPUT_VERSION"
          else
            RAW="$REF_NAME"
          fi

          if [ -z "$RAW" ]; then
            echo "::error::版本号为空"
            exit 1
          fi

          V="${RAW#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

          if [[ "$V" == *-* || "$V" == *+* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          NUM="${V%%-*}"
          NUM="${NUM%%+*}"
          IFS='.' read -r a b c _rest <<< "$NUM" || true
          NUMVER="${a:-0}.${b:-0}.${c:-0}.0"
          echo "numversion=$NUMVER" >> "$GITHUB_OUTPUT"

          echo "版本: $V"
          echo "文件版本: $NUMVER"

      - name: Locate csproj and platforms
        id: find
        shell: bash
        run: |
          set -euo pipefail

          p=""
          for c in "${PROJECT}" "${APP_NAME}/${APP_NAME}.csproj" "${APP_NAME}.csproj"; do
            if [ -n "$c" ] && [ -f "$c" ]; then p="$c"; break; fi
          done

          if [ -z "$p" ]; then
            echo "给定路径不存在，按内容探测 WinUI 主工程..."
            p=$(grep -rl --include='*.csproj' -E 'UseWinUI|WindowsAppSDK' . \
                 | grep -v '/bin/' | grep -v '/obj/' | head -n1 || true)
          fi

          if [ -z "$p" ]; then
            echo "::error::找不到 WinUI 主工程，请修改 env.PROJECT"
            exit 1
          fi

          p="${p#./}"
          echo "project=$p" >> "$GITHUB_OUTPUT"

          props="$(cat "$p")"
          if [ -f Directory.Build.props ]; then
            props="$props$(cat Directory.Build.props)"
          fi

          plats="$(printf '%s' "$props" | tr -d '\r\n' \
                   | grep -o '<Platforms>[^<]*</Platforms>' | head -n1 \
                   | sed -E 's#</?Platforms>##g' || true)"
          echo "platforms=$plats" >> "$GITHUB_OUTPUT"

          echo "主工程: $p"
          echo "Platforms: ${plats:-（未声明，构建时不传 /p:Platform）}"

  # ─────────── 2. 三架构 + 三个安装包 ───────────
  build:
    needs: prepare
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x86
            platform: x86
            app_arch: x86
            inno_arch: x86compatible
          - rid: win-x64
            platform: x64
            app_arch: x64
            inno_arch: x64compatible
          - rid: win-arm64
            platform: ARM64
            app_arch: arm64
            inno_arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Publish ${{ env.APP_NAME }} (${{ matrix.app_arch }})
        shell: pwsh
        env:
          PROJECT: ${{ needs.prepare.outputs.project }}
          PLATFORMS: ${{ needs.prepare.outputs.platforms }}
          NUMVER: ${{ needs.prepare.outputs.numversion }}
        run: |
          $ErrorActionPreference = "Stop"

          $out = Join-Path $env:GITHUB_WORKSPACE "publish/${{ matrix.rid }}"
          if (Test-Path -LiteralPath $out) { Remove-Item -LiteralPath $out -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $args = @(
            $env:PROJECT
            "/restore"
            "/t:Publish"
            "/p:Configuration=Release"
            "/p:RuntimeIdentifier=${{ matrix.rid }}"
            "/p:SelfContained=true"
            "/p:WindowsAppSDKSelfContained=true"
            "/p:Version=$env:NUMVER"
            "/p:FileVersion=$env:NUMVER"
            "/p:AssemblyVersion=$env:NUMVER"
            "/p:PublishDir=$out/"
          )

          $declared = @()
          if ($env:PLATFORMS) {
            $declared = @($env:PLATFORMS -split ';' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          }

          if ($declared -contains "${{ matrix.platform }}") {
            $args += "/p:Platform=${{ matrix.platform }}"
            Write-Host "Platform: ${{ matrix.platform }}"
          } else {
            Write-Host "工程未声明 ${{ matrix.platform }}，仅靠 RuntimeIdentifier 决定架构"
          }

          & msbuild @args
          if ($LASTEXITCODE -ne 0) { throw "msbuild publish 失败: ${{ matrix.app_arch }}" }

      - name: Verify output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dir = Join-Path $env:GITHUB_WORKSPACE "publish/${{ matrix.rid }}"
          $exe = Join-Path $dir "${env:APP_NAME}.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "找不到 $exe，请核对 AssemblyName" }

          $pri = @(Get-ChildItem -LiteralPath $dir -Filter *.pri -File -ErrorAction SilentlyContinue)
          if ($pri.Count -eq 0) { throw "publish 目录没有 pri 资源文件，产物启动会报 0xC000027B" }

          $files = @(Get-ChildItem -LiteralPath $dir -Recurse -File)
          $sum = ($files | Measure-Object Length -Sum).Sum
          $mb = if ($sum) { [math]::Round($sum / 1MB, 1) } else { 0 }
          Write-Host "文件数: $($files.Count)，总大小: $mb MB"

          if ($mb -lt 60) {
            Write-Host "::warning::体积偏小，SelfContained 或 WindowsAppSDKSelfContained 可能未生效"
          }

      - name: Cache Inno Setup
        uses: actions/cache@v4
        with:
          path: C:\InnoSetup
          key: innosetup-${{ env.INNO_VERSION }}-x64

      - name: Install Inno Setup ${{ env.INNO_VERSION }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dir  = "C:\InnoSetup"
          $iscc = Join-Path $dir "ISCC.exe"
          $want = (($env:INNO_VERSION -split '\.')[0..1] -join '.')
          $tag  = "is-" + ($env:INNO_VERSION -replace '\.', '_')

          function Get-IsccVer([string]$p) {
            if (-not (Test-Path -LiteralPath $p)) { return $null }
            $v = (& $p --version 2>$null | Select-Object -First 1)
            if (-not $v) { $v = (Get-Item -LiteralPath $p).VersionInfo.FileVersion }
            if ($v -and ($v -match '(\d+\.\d+(?:\.\d+)?)')) { return $Matches[1] }
            return $null
          }

          $ver = Get-IsccVer $iscc
          $got = $null
          if ($ver) { $got = ($ver -split '\.')[0..1] -join '.' }

          if ($got -eq $want) {
            Write-Host "缓存命中: $iscc (v$ver)"
          } else {
            Write-Host "安装 Inno Setup $env:INNO_VERSION"
            if (Test-Path -LiteralPath $dir) { Remove-Item -LiteralPath $dir -Recurse -Force }

            $url   = "https://github.com/jrsoftware/issrc/releases/download/$tag/innosetup-$env:INNO_VERSION-x64.exe"
            $setup = Join-Path $env:RUNNER_TEMP "innosetup.exe"
            Write-Host "下载 $url"
            Invoke-WebRequest -Uri $url -OutFile $setup -UseBasicParsing

            $fs = [IO.File]::OpenRead($setup)
            try {
              $b = New-Object byte[] 2
              [void]$fs.Read($b, 0, 2)
              if ($b[0] -ne 0x4D -or $b[1] -ne 0x5A) { throw "下载的不是有效 PE，可能被代理拦截" }
            } finally { $fs.Dispose() }

            $proc = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
              "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$dir"
            )
            if ($proc.ExitCode -ne 0) { throw "安装器退出码 $($proc.ExitCode)" }

            $ver = Get-IsccVer $iscc
            $got = $null
            if ($ver) { $got = ($ver -split '\.')[0..1] -join '.' }
          }

          if ($got -ne $want) { throw "版本不符：期望 $($want).x，实际 $ver" }

          "ISCC=$iscc" >> $env:GITHUB_ENV
          Write-Host "ISCC: $iscc (v$ver)"

      - name: Build installer (${{ matrix.app_arch }})
        shell: pwsh
        run: |
          & $env:ISCC `
            "/DAppVersion=${{ needs.prepare.outputs.version }}" `
            "/DAppVersion4=${{ needs.prepare.outputs.numversion }}" `
            "/DSourceDir=$env:GITHUB_WORKSPACE\publish\${{ matrix.rid }}" `
            "/DOutputDir=$env:GITHUB_WORKSPACE\dist" `
            "/DAppArch=${{ matrix.app_arch }}" `
            "/DInnoArch=${{ matrix.inno_arch }}" `
            "installer/installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 编译失败: ${{ matrix.app_arch }}" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.app_arch }}
          path: dist/*.exe
          if-no-files-found: error

  # ─────────── 3. x64 便携版（zip） ───────────
  portable:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Publish portable folder (x64)
        shell: pwsh
        env:
          PROJECT: ${{ needs.prepare.outputs.project }}
          PLATFORMS: ${{ needs.prepare.outputs.platforms }}
          NUMVER: ${{ needs.prepare.outputs.numversion }}
          VER: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"

          # 目录名带版本号：zip 的顶层文件夹会直接沿用这个名字
          $folder = "${env:APP_NAME}-$($env:VER)-x64-portable"
          $out = Join-Path $env:GITHUB_WORKSPACE "publish/$folder"
          if (Test-Path -LiteralPath $out) { Remove-Item -LiteralPath $out -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $args = @(
            $env:PROJECT
            "/restore"
            "/t:Publish"
            "/p:Configuration=Release"
            "/p:RuntimeIdentifier=win-x64"
            "/p:SelfContained=true"
            "/p:WindowsAppSDKSelfContained=true"
            "/p:PublishTrimmed=false"
            "/p:PublishReadyToRun=false"
            "/p:Version=$env:NUMVER"
            "/p:FileVersion=$env:NUMVER"
            "/p:AssemblyVersion=$env:NUMVER"
            "/p:PublishDir=$out/"
          )

          $declared = @()
          if ($env:PLATFORMS) {
            $declared = @($env:PLATFORMS -split ';' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          }
          if ($declared -contains "x64") { $args += "/p:Platform=x64" }

          & msbuild @args
          if ($LASTEXITCODE -ne 0) { throw "便携版发布失败" }

          "PORTABLE_DIR=$out" >> $env:GITHUB_ENV

      - name: Verify portable folder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dir = $env:PORTABLE_DIR
          if (-not $dir -or -not (Test-Path -LiteralPath $dir)) { throw "便携版目录不存在: $dir" }

          foreach ($f in @("${env:APP_NAME}.exe", "Microsoft.UI.Xaml.dll")) {
            if (-not (Test-Path -LiteralPath (Join-Path $dir $f))) { throw "便携版目录缺少 $f" }
          }
          $pri = @(Get-ChildItem -LiteralPath $dir -Filter *.pri -File -ErrorAction SilentlyContinue)
          if ($pri.Count -eq 0) { throw "便携版目录没有 pri 资源文件，解压后启动会报 0xC000027B" }

          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE/dist" | Out-Null

          $sum = (Get-ChildItem -LiteralPath $dir -Recurse -File | Measure-Object Length -Sum).Sum
          $mb = if ($sum) { [math]::Round($sum / 1MB, 1) } else { 0 }
          Write-Host "便携版目录: $dir ($mb MB)"

      - name: Package portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dir = $env:PORTABLE_DIR
          $zip = Join-Path $env:GITHUB_WORKSPACE "dist/$((Split-Path $dir -Leaf)).zip"
          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          # 第四参为 true：zip 内保留一层同名文件夹，解压后不会散落一地文件
          [IO.Compression.ZipFile]::CreateFromDirectory(
            $dir,
            $zip,
            [IO.Compression.CompressionLevel]::Optimal,
            $true)

          $mb = [math]::Round((Get-Item -LiteralPath $zip).Length / 1MB, 1)
          Write-Host "便携版 zip: $zip ($mb MB)"

          # 校验压缩包内确实有 exe 与 pri
          $za = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $names = $za.Entries | ForEach-Object { $_.FullName }
            if (-not ($names -match "${env:APP_NAME}\.exe$")) { throw "zip 内没有 ${env:APP_NAME}.exe" }
            if (-not ($names -match "\.pri$")) { throw "zip 内没有 pri 资源文件" }
            Write-Host "压缩包条目数: $($names.Count)"
          } finally { $za.Dispose() }

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: portable-x64
          path: dist/*-portable.zip
          if-no-files-found: error

  # ─────────── 4. 汇总成草稿 Release ───────────
  release:
    needs: [prepare, build, portable]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List files
        shell: bash
        run: |
          ls -lh dist || true

          setups=$(find dist -maxdepth 1 -name '*-setup.exe' | wc -l)
          zips=$(find dist -maxdepth 1 -name '*-portable.zip' | wc -l)

          echo "安装包 $setups 个 / 便携 zip $zips 个"

          if [ "$setups" -ne 3 ]; then
            echo "::warning::期望 3 个安装包，实际 $setups"
          fi
          if [ "$zips" -ne 1 ]; then
            echo "::warning::期望 1 个便携 zip，实际 $zips"
          fi

          exit 0

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report result
        if: always()
        shell: bash
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "草稿地址: https://github.com/${{ github.repository }}/releases"
            echo "正式发布: gh release edit ${{ needs.prepare.outputs.tag }} --draft=false"
          else
            echo "::error::Release 创建失败，检查上方日志中的 403 或 unmatched files"
          fi
