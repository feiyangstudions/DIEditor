name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 1.2.0（带不带 v 都行）"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: DIEditor
  PROJECT: DIEditor/DIEditor.csproj
  DOTNET_VERSION: "10.0.x"
  INNO_VERSION: "7.1.1"

jobs:
  # ─────────── 1. 版本号 + 工程定位 ───────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      numversion: ${{ steps.ver.outputs.numversion }}
      tag: ${{ steps.ver.outputs.tag }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
      project: ${{ steps.find.outputs.project }}
      platforms: ${{ steps.find.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RAW="$INPUT_VERSION"
          else
            RAW="$REF_NAME"
          fi

          if [ -z "$RAW" ]; then
            echo "::error::版本号为空"
            exit 1
          fi

          V="${RAW#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

          if [[ "$V" == *-* || "$V" == *+* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          NUM="${V%%-*}"
          NUM="${NUM%%+*}"
          IFS='.' read -r a b c _rest <<< "$NUM" || true
          NUMVER="${a:-0}.${b:-0}.${c:-0}.0"
          echo "numversion=$NUMVER" >> "$GITHUB_OUTPUT"

          echo "版本: $V"
          echo "文件版本: $NUMVER"

      - name: Locate csproj and platforms
        id: find
        shell: bash
        run: |
          set -euo pipefail

          p=""
          for c in "${PROJECT}" "${APP_NAME}/${APP_NAME}.csproj" "${APP_NAME}.csproj"; do
            if [ -n "$c" ] && [ -f "$c" ]; then p="$c"; break; fi
          done

          if [ -z "$p" ]; then
            echo "给定路径不存在，按内容探测 WinUI 主工程..."
            p=$(grep -rl --include='*.csproj' -E 'UseWinUI|WindowsAppSDK' . \
                 | grep -v '/bin/' | grep -v '/obj/' | head -n1 || true)
          fi

          if [ -z "$p" ]; then
            echo "::error::找不到 WinUI 主工程，请修改 env.PROJECT"
            exit 1
          fi

          p="${p#./}"
          echo "project=$p" >> "$GITHUB_OUTPUT"

          props="$(cat "$p")"
          if [ -f Directory.Build.props ]; then
            props="$props$(cat Directory.Build.props)"
          fi

          plats="$(printf '%s' "$props" | tr -d '\r\n' \
                   | grep -o '<Platforms>[^<]*</Platforms>' | head -n1 \
                   | sed -E 's#</?Platforms>##g' || true)"
          echo "platforms=$plats" >> "$GITHUB_OUTPUT"

          echo "主工程: $p"
          echo "Platforms: ${plats:-（未声明，构建时不传 /p:Platform）}"

  # ─────────── 2. 三架构 + 三个安装包 ───────────
  build:
    needs: prepare
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x86
            platform: x86
            app_arch: x86
            inno_arch: x86compatible
          - rid: win-x64
            platform: x64
            app_arch: x64
            inno_arch: x64compatible
          - rid: win-arm64
            platform: ARM64
            app_arch: arm64
            inno_arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Publish ${{ env.APP_NAME }} (${{ matrix.app_arch }})
        shell: pwsh
        env:
          PROJECT: ${{ needs.prepare.outputs.project }}
          PLATFORMS: ${{ needs.prepare.outputs.platforms }}
          NUMVER: ${{ needs.prepare.outputs.numversion }}
        run: |
          $ErrorActionPreference = "Stop"

          $out = Join-Path $env:GITHUB_WORKSPACE "publish/${{ matrix.rid }}"
          if (Test-Path -LiteralPath $out) { Remove-Item -LiteralPath $out -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $args = @(
            $env:PROJECT
            "/restore"
            "/t:Publish"
            "/p:Configuration=Release"
            "/p:RuntimeIdentifier=${{ matrix.rid }}"
            "/p:SelfContained=true"
            "/p:WindowsAppSDKSelfContained=true"
            "/p:Version=$env:NUMVER"
            "/p:FileVersion=$env:NUMVER"
            "/p:AssemblyVersion=$env:NUMVER"
            "/p:PublishDir=$out/"
          )

          $declared = @()
          if ($env:PLATFORMS) {
            $declared = @($env:PLATFORMS -split ';' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          }

          if ($declared -contains "${{ matrix.platform }}") {
            $args += "/p:Platform=${{ matrix.platform }}"
            Write-Host "Platform: ${{ matrix.platform }}"
          } else {
            Write-Host "工程未声明 ${{ matrix.platform }}，仅靠 RuntimeIdentifier 决定架构"
          }

          & msbuild @args
          if ($LASTEXITCODE -ne 0) { throw "msbuild publish 失败: ${{ matrix.app_arch }}" }

      - name: Verify output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dir = Join-Path $env:GITHUB_WORKSPACE "publish/${{ matrix.rid }}"
          $exe = Join-Path $dir "${env:APP_NAME}.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "找不到 $exe，请核对 AssemblyName" }

          $pri = @(Get-ChildItem -LiteralPath $dir -Filter *.pri -File -ErrorAction SilentlyContinue)
          if ($pri.Count -eq 0) { throw "publish 目录没有 pri 资源文件，产物启动会报 0xC000027B" }

          $files = @(Get-ChildItem -LiteralPath $dir -Recurse -File)
          $sum = ($files | Measure-Object Length -Sum).Sum
          $mb = if ($sum) { [math]::Round($sum / 1MB, 1) } else { 0 }
          Write-Host "文件数: $($files.Count)，总大小: $mb MB"

          if ($mb -lt 60) {
            Write-Host "::warning::体积偏小，SelfContained 或 WindowsAppSDKSelfContained 可能未生效"
          }

      - name: Cache Inno Setup
        uses: actions/cache@v4
        with:
          path: C:\InnoSetup
          key: innosetup-${{ env.INNO_VERSION }}-x64

      - name: Install Inno Setup ${{ env.INNO_VERSION }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dir  = "C:\InnoSetup"
          $iscc = Join-Path $dir "ISCC.exe"
          $want = (($env:INNO_VERSION -split '\.')[0..1] -join '.')
          $tag  = "is-" + ($env:INNO_VERSION -replace '\.', '_')

          function Get-IsccVer([string]$p) {
            if (-not (Test-Path -LiteralPath $p)) { return $null }
            $v = (& $p --version 2>$null | Select-Object -First 1)
            if (-not $v) { $v = (Get-Item -LiteralPath $p).VersionInfo.FileVersion }
            if ($v -and ($v -match '(\d+\.\d+(?:\.\d+)?)')) { return $Matches[1] }
            return $null
          }

          $ver = Get-IsccVer $iscc
          $got = $null
          if ($ver) { $got = ($ver -split '\.')[0..1] -join '.' }

          if ($got -eq $want) {
            Write-Host "缓存命中: $iscc (v$ver)"
          } else {
            Write-Host "安装 Inno Setup $env:INNO_VERSION"
            if (Test-Path -LiteralPath $dir) { Remove-Item -LiteralPath $dir -Recurse -Force }

            $url   = "https://github.com/jrsoftware/issrc/releases/download/$tag/innosetup-$env:INNO_VERSION-x64.exe"
            $setup = Join-Path $env:RUNNER_TEMP "innosetup.exe"
            Write-Host "下载 $url"
            Invoke-WebRequest -Uri $url -OutFile $setup -UseBasicParsing

            $fs = [IO.File]::OpenRead($setup)
            try {
              $b = New-Object byte[] 2
              [void]$fs.Read($b, 0, 2)
              if ($b[0] -ne 0x4D -or $b[1] -ne 0x5A) { throw "下载的不是有效 PE，可能被代理拦截" }
            } finally { $fs.Dispose() }

            $proc = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
              "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$dir"
            )
            if ($proc.ExitCode -ne 0) { throw "安装器退出码 $($proc.ExitCode)" }

            $ver = Get-IsccVer $iscc
            $got = $null
            if ($ver) { $got = ($ver -split '\.')[0..1] -join '.' }
          }

          if ($got -ne $want) { throw "版本不符：期望 $($want).x，实际 $ver" }

          "ISCC=$iscc" >> $env:GITHUB_ENV
          Write-Host "ISCC: $iscc (v$ver)"

      - name: Build installer (${{ matrix.app_arch }})
        shell: pwsh
        run: |
          & $env:ISCC `
            "/DAppVersion=${{ needs.prepare.outputs.version }}" `
            "/DAppVersion4=${{ needs.prepare.outputs.numversion }}" `
            "/DSourceDir=$env:GITHUB_WORKSPACE\publish\${{ matrix.rid }}" `
            "/DOutputDir=$env:GITHUB_WORKSPACE\dist" `
            "/DAppArch=${{ matrix.app_arch }}" `
            "/DInnoArch=${{ matrix.inno_arch }}" `
            "installer/installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 编译失败: ${{ matrix.app_arch }}" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.app_arch }}
          path: dist/*.exe
          if-no-files-found: error

  # ─────────── 3. x64 便携版：zip + 自解压单文件 ───────────
  portable:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Publish portable folder (x64)
        shell: pwsh
        env:
          PROJECT: ${{ needs.prepare.outputs.project }}
          PLATFORMS: ${{ needs.prepare.outputs.platforms }}
          NUMVER: ${{ needs.prepare.outputs.numversion }}
        run: |
          $ErrorActionPreference = "Stop"

          $out = Join-Path $env:GITHUB_WORKSPACE "publish/portable"
          if (Test-Path -LiteralPath $out) { Remove-Item -LiteralPath $out -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $args = @(
            $env:PROJECT
            "/restore"
            "/t:Publish"
            "/p:Configuration=Release"
            "/p:RuntimeIdentifier=win-x64"
            "/p:SelfContained=true"
            "/p:WindowsAppSDKSelfContained=true"
            "/p:PublishTrimmed=false"
            "/p:PublishReadyToRun=false"
            "/p:Version=$env:NUMVER"
            "/p:FileVersion=$env:NUMVER"
            "/p:AssemblyVersion=$env:NUMVER"
            "/p:PublishDir=$out/"
          )

          $declared = @()
          if ($env:PLATFORMS) {
            $declared = @($env:PLATFORMS -split ';' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          }
          if ($declared -contains "x64") { $args += "/p:Platform=x64" }

          & msbuild @args
          if ($LASTEXITCODE -ne 0) { throw "便携版发布失败" }

      - name: Verify portable folder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dir = Join-Path $env:GITHUB_WORKSPACE "publish/portable"
          foreach ($f in @("${env:APP_NAME}.exe", "Microsoft.UI.Xaml.dll")) {
            if (-not (Test-Path -LiteralPath (Join-Path $dir $f))) { throw "便携版目录缺少 $f" }
          }
          $pri = @(Get-ChildItem -LiteralPath $dir -Filter *.pri -File -ErrorAction SilentlyContinue)
          if ($pri.Count -eq 0) { throw "便携版目录没有 pri 资源文件" }

          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE/dist" | Out-Null

          $sum = (Get-ChildItem -LiteralPath $dir -Recurse -File | Measure-Object Length -Sum).Sum
          $mb = if ($sum) { [math]::Round($sum / 1MB, 1) } else { 0 }
          Write-Host "便携版目录: $mb MB"

      - name: Package portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ver = "${{ needs.prepare.outputs.version }}"
          $zip = Join-Path $env:GITHUB_WORKSPACE "dist/${env:APP_NAME}-$ver-x64-portable.zip"
          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::CreateFromDirectory(
            (Join-Path $env:GITHUB_WORKSPACE "publish/portable"),
            $zip,
            [IO.Compression.CompressionLevel]::Optimal,
            $false)

          $mb = [math]::Round((Get-Item -LiteralPath $zip).Length / 1MB, 1)
          Write-Host "便携版 zip: $zip ($mb MB)"

      # 单文件属于尽力而为：失败不影响 zip 与三个安装包交付
      - name: Build single-exe (7-Zip SFX)
        continue-on-error: true
        shell: pwsh
        env:
          VER: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"

          $src = Join-Path $env:GITHUB_WORKSPACE "publish/portable"
          $out = Join-Path $env:GITHUB_WORKSPACE "dist/${env:APP_NAME}-$($env:VER)-x64-single-exe.exe"
          $tmp = Join-Path $env:RUNNER_TEMP "sfxbuild"

          $sevenZip = Join-Path $env:ProgramFiles "7-Zip\7z.exe"
          if (-not (Test-Path -LiteralPath $sevenZip)) {
            $sevenZip = Join-Path ${env:ProgramFiles(x86)} "7-Zip\7z.exe"
          }
          if (-not (Test-Path -LiteralPath $sevenZip)) { throw "runner 上找不到 7z.exe" }
          $sevenZipDir = Split-Path $sevenZip -Parent
          Write-Host "7z: $sevenZip"
          Write-Host "7z 目录内容: $((Get-ChildItem $sevenZipDir -Filter *.sfx | Select-Object -ExpandProperty Name) -join ', ')"

          if (Test-Path -LiteralPath $tmp) { Remove-Item -LiteralPath $tmp -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null

          # ---------- 找“安装器型” SFX 模块 ----------
          $module = $null
          $kind = $null

          foreach ($n in @("7zS.sfx","7zSD.sfx","7zS2.sfx","7zS2con.sfx","7zSCon.sfx")) {
            $c = Join-Path $sevenZipDir $n
            if (Test-Path -LiteralPath $c) { $module = $c; $kind = "installdir"; break }
          }
          if ($module) { Write-Host "模块来源: 安装目录 -> $module" }

          if (-not $module) {
            Write-Host "安装目录没有安装器型模块，尝试官方 small SFX 包..."
            try {
              $pkg = Join-Path $tmp "sfxsmall.7z"
              Invoke-WebRequest -Uri "https://dl.7-zip.org/7z917a1_sfx.7z" -OutFile $pkg -UseBasicParsing -TimeoutSec 90
              $x = Join-Path $tmp "small"
              & $sevenZip x $pkg "-o$x" -y | Out-Null
              $cand = @(Get-ChildItem -LiteralPath $x -Recurse -File -ErrorAction SilentlyContinue |
                        Where-Object { $_.Extension -ieq ".sfx" } |
                        Sort-Object { if ($_.Name -ieq "7zS2.sfx") { 0 } else { 1 } })
              Write-Host "small 包内: $(if ($cand.Count) { ($cand.Name -join ', ') } else { '无 sfx' })"
              if ($cand.Count -gt 0) { $module = $cand[0].FullName; $kind = "small-sfx" }
            } catch {
              Write-Host "small SFX 包获取失败: $($_.Exception.Message)"
            }
          }

          if (-not $module) {
            Write-Host "尝试 7-Zip Extra 包..."
            try {
              $headers = @{ "User-Agent" = "DIEditor-CI"; "Accept" = "application/vnd.github+json" }
              $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/ip7z/7zip/releases/latest" -Headers $headers
              $asset = @($rel.assets | Where-Object { $_.name -like "*-extra.7z" }) | Select-Object -First 1
              if ($asset) {
                Write-Host "下载 $($asset.name)"
                $extra = Join-Path $tmp "extra.7z"
                Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $extra -UseBasicParsing
                $x = Join-Path $tmp "extra"
                & $sevenZip x $extra "-o$x" -y | Out-Null
                $all = @(Get-ChildItem -LiteralPath $x -Recurse -File -ErrorAction SilentlyContinue)
                Write-Host "Extra 共 $($all.Count) 个文件: $(($all.Name | Select-Object -First 40) -join ', ')"
                $cand = @($all | Where-Object { $_.Extension -ieq ".sfx" })
                if ($cand.Count -gt 0) { $module = $cand[0].FullName; $kind = "extra" }
              }
            } catch {
              Write-Host "Extra 获取失败: $($_.Exception.Message)"
            }
          }

          if (-not $module) {
            $c = Join-Path $sevenZipDir "7z.sfx"
            if (Test-Path -LiteralPath $c) {
              $module = $c; $kind = "gui-sfx"
              Write-Host "::warning::回退到 7z.sfx，若双击后不自动启动程序，请改用 zip 分发"
            }
          }

          if (-not $module) { throw "找不到任何 SFX 模块" }
          Write-Host "SFX 模块: $module ($kind)"

          # ---------- config.txt（UTF-8 无 BOM，末尾必须有换行） ----------
          $cfg = (@(
            ';!@Install@!UTF-8!'
            ('Title="' + $env:APP_NAME + ' ' + $env:VER + '"')
            ('RunProgram="' + $env:APP_NAME + '.exe"')
            'GUIMode="2"'
            ';!@InstallEnd@!'
          ) -join "`r`n") + "`r`n"

          $cfgPath = Join-Path $tmp "config.txt"
          [IO.File]::WriteAllText($cfgPath, $cfg, (New-Object System.Text.UTF8Encoding($false)))

          # ---------- payload ----------
          $payload = Join-Path $tmp "payload.7z"
          Push-Location $src
          try {
            & $sevenZip a -t7z -mx=5 -y $payload ".\*" -r | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "生成 payload 失败（exit $LASTEXITCODE）" }
          } finally {
            Pop-Location
          }

          # ---------- 三段二进制拼接（等价 copy /b，但不依赖模块与 7z.exe 同目录） ----------
          if (Test-Path -LiteralPath $out) { Remove-Item -LiteralPath $out -Force }

          $parts = @($module, $cfgPath, $payload)
          $fs = [IO.File]::Create($out)
          try {
            foreach ($p in $parts) {
              $in = [IO.File]::OpenRead($p)
              try { $in.CopyTo($fs) } finally { $in.Dispose() }
            }
          } finally {
            $fs.Dispose()
          }

          $expect = ($parts | ForEach-Object { (Get-Item -LiteralPath $_).Length } | Measure-Object -Sum).Sum
          $actual = (Get-Item -LiteralPath $out).Length
          Write-Host "拼接: 期望 $expect 字节，实际 $actual 字节"
          if ($actual -ne $expect) { throw "拼接结果与预期不一致" }

          $mb = [math]::Round($actual / 1MB, 1)
          Write-Host "自解压单文件: $out ($mb MB)"

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: portable-x64
          path: |
            dist/*-portable.zip
            dist/*-single-exe.exe
          if-no-files-found: warn

  # ─────────── 4. 汇总成草稿 Release ───────────
  release:
    needs: [prepare, build, portable]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List files
        shell: bash
        run: |
          ls -lh dist || true

          setups=$(find dist -maxdepth 1 -name '*-setup.exe' | wc -l)
          zips=$(find dist -maxdepth 1 -name '*-portable.zip' | wc -l)
          sfx=$(find dist -maxdepth 1 -name '*-single-exe.exe' | wc -l)

          echo "安装包 $setups 个 / 便携 zip $zips 个 / 单文件 $sfx 个"

          if [ "$setups" -ne 3 ]; then
            echo "::warning::期望 3 个安装包，实际 $setups"
          fi
          if [ "$zips" -ne 1 ]; then
            echo "::warning::期望 1 个便携 zip，实际 $zips"
          fi
          if [ "$sfx" -ne 1 ]; then
            echo "::warning::未生成自解压单文件，zip 版不受影响"
          fi

          exit 0

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report result
        if: always()
        shell: bash
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "草稿地址: https://github.com/${{ github.repository }}/releases"
            echo "正式发布: gh release edit ${{ needs.prepare.outputs.tag }} --draft=false"
          else
            echo "::error::Release 创建失败，检查上方日志中的 403 或 unmatched files"
          fi
