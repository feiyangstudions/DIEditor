name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 1.2.0（带不带 v 都行）"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_NAME: DIEditor
  # 主工程 csproj 路径（相对仓库根目录）。
  # 常见写法：DIEditor/DIEditor.csproj 或 DIEditor.csproj
  # 写错了也没关系，prepare 会自动探测。
  PROJECT: DIEditor/DIEditor.csproj
  # 对齐 csproj 里的 TargetFramework：net8.0 → 8.0.x，net9.0 → 9.0.x，net10.0 → 10.0.x
  DOTNET_VERSION: "10.0.x"

jobs:
  # ─────────────── 1. 版本号 + 工程定位 ───────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      project: ${{ steps.find.outputs.project }}
      platforms: ${{ steps.find.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          RAW="${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          V="${RAW#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "版本: $V"

      - name: Locate csproj and platforms
        id: find
        shell: bash
        run: |
          set -euo pipefail

          p=""
          for c in "${PROJECT}" "${APP_NAME}/${APP_NAME}.csproj" "${APP_NAME}.csproj"; do
            if [ -n "$c" ] && [ -f "$c" ]; then p="$c"; break; fi
          done

          if [ -z "$p" ]; then
            echo "给定路径不存在，开始按内容探测 WinUI 主工程..."
            p=$(grep -rl --include='*.csproj' -E 'UseWinUI|WindowsAppSDK' . \
                 | grep -v '/bin/' | grep -v '/obj/' | head -n1 || true)
          fi

          if [ -z "$p" ]; then
            echo "::error::找不到 WinUI 主工程，请把 env.PROJECT 改成实际的 csproj 路径"
            exit 1
          fi

          p="${p#./}"
          echo "project=$p" >> "$GITHUB_OUTPUT"

          props="$(cat "$p")"
          if [ -f Directory.Build.props ]; then
            props="$props$(cat Directory.Build.props)"
          fi
          plats=$(printf '%s' "$props" \
                  | grep -o '<Platforms>[^<]*</Platforms>' \
                  | head -n1 | sed -E 's#</?Platforms>##g' || true)
          echo "platforms=$plats" >> "$GITHUB_OUTPUT"

          echo "主工程: $p"
          echo "Platforms: ${plats:-（未声明，构建时不传 /p:Platform）}"

  # ─────────────── 2. 三个架构 + 三个安装包 ───────────────
  build:
    needs: prepare
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x86
            platform: x86
            app_arch: x86
            inno_arch: x86compatible
          - rid: win-x64
            platform: x64
            app_arch: x64
            inno_arch: x64compatible
          - rid: win-arm64
            platform: ARM64
            app_arch: arm64
            inno_arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Publish DIEditor (${{ matrix.app_arch }})
        shell: pwsh
        env:
          PROJECT: ${{ needs.prepare.outputs.project }}
          PLATFORMS: ${{ needs.prepare.outputs.platforms }}
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "publish/${{ matrix.rid }}"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $a = @(
            $env:PROJECT,
            "/restore",
            "/t:Publish",
            "/p:Configuration=Release",
            "/p:RuntimeIdentifier=${{ matrix.rid }}",
            "/p:SelfContained=true",
            "/p:WindowsAppSDKSelfContained=true",
            "/p:PublishDir=$out/"
          )

          $declared = $env:PLATFORMS -split ';' | ForEach-Object { $_.Trim() }
          if ($declared -contains "${{ matrix.platform }}") {
            $a += "/p:Platform=${{ matrix.platform }}"
            Write-Host "平台: ${{ matrix.platform }}"
          } else {
            Write-Host "工程未声明 ${{ matrix.platform }} 平台，跳过 /p:Platform"
          }

          & msbuild @a
          if ($LASTEXITCODE -ne 0) { throw "msbuild publish 失败: ${{ matrix.app_arch }}" }

      - name: Verify output
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "publish/${{ matrix.rid }}/${env:APP_NAME}.exe"
          if (-not (Test-Path $exe)) { throw "找不到 $exe，请核对 csproj 的 AssemblyName" }
          $size = [math]::Round((Get-ChildItem (Split-Path $exe) -Recurse |
                   Measure-Object Length -Sum).Sum / 1MB, 1)
          Write-Host "产物大小: $size MB"

      - name: Locate Inno Setup
        shell: pwsh
        run: |
          function Find-Iscc {
            @(
              "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
              "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:LOCALAPPDATA\Programs\Inno Setup 7\ISCC.exe",
              "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }

          $iscc = Find-Iscc
          if (-not $iscc) {
            Write-Host "未检测到 Inno Setup，开始静默安装..."
            $exe = Join-Path $env:RUNNER_TEMP "innosetup.exe"
            Invoke-WebRequest "https://jrsoftware.org/download.php/is.exe?dontcount=1" -OutFile $exe -UseBasicParsing
            Start-Process $exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait
            $iscc = Find-Iscc
          }
          if (-not $iscc) { throw "找不到 ISCC.exe，Inno Setup 安装失败" }

          $ver = [version]((Get-Item $iscc).VersionInfo.ProductVersion -split '\s+')[0]
          if ($ver -lt [version]"6.3") {
            throw "Inno Setup 版本过低（$ver）：arm64 架构标识需要 6.3 及以上"
          }

          "ISCC=$iscc" >> $env:GITHUB_ENV
          Write-Host "编译器: $iscc (v$ver)"

      - name: Build DIEditor installer
        shell: pwsh
        run: |
          & $env:ISCC `
            "/DAppVersion=${{ needs.prepare.outputs.version }}" `
            "/DSourceDir=$env:GITHUB_WORKSPACE\publish\${{ matrix.rid }}" `
            "/DOutputDir=$env:GITHUB_WORKSPACE\dist" `
            "/DAppArch=${{ matrix.app_arch }}" `
            "/DInnoArch=${{ matrix.inno_arch }}" `
            "installer/installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 编译失败: ${{ matrix.app_arch }}" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.app_arch }}
          path: dist/*.exe
          if-no-files-found: error

  # ─────────────── 3. x64 单文件便携版 ───────────────
  portable:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Publish single-file portable (x64)
        shell: pwsh
        env:
          PROJECT: ${{ needs.prepare.outputs.project }}
          PLATFORMS: ${{ needs.prepare.outputs.platforms }}
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "publish/portable"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $a = @(
            $env:PROJECT,
            "/restore",
            "/t:Publish",
            "/p:Configuration=Release",
            "/p:RuntimeIdentifier=win-x64",
            "/p:SelfContained=true",
            "/p:WindowsAppSDKSelfContained=true",
            "/p:EnableMsixTooling=true",
            "/p:IncludeAllContentForSelfExtract=true",
            "/p:PublishSingleFile=true",
            "/p:PublishTrimmed=false",
            "/p:PublishReadyToRun=false",
            "/p:PublishDir=$out/"
          )

          $declared = $env:PLATFORMS -split ';' | ForEach-Object { $_.Trim() }
          if ($declared -contains "x64") { $a += "/p:Platform=x64" }

          & msbuild @a
          if ($LASTEXITCODE -ne 0) { throw "单文件发布失败" }

      - name: Stage portable exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE/dist" | Out-Null
          $src = Join-Path $env:GITHUB_WORKSPACE "publish/portable/${env:APP_NAME}.exe"
          if (-not (Test-Path $src)) { throw "单文件发布没有产出 ${env:APP_NAME}.exe" }
          $dst = "$env:GITHUB_WORKSPACE/dist/${env:APP_NAME}-${{ needs.prepare.outputs.version }}-x64-portable.exe"
          Copy-Item $src $dst
          $mb = [math]::Round((Get-Item $dst).Length / 1MB, 1)
          Write-Host "便携版: $dst ($mb MB)"

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: portable-x64
          path: dist/*.exe
          if-no-files-found: error

  # ─────────────── 4. 汇总成草稿 Release ───────────────
  release:
    needs: [prepare, build, portable]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List files
        run: ls -lh dist

      - name: Create draft release (body left empty)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: false
          generate_release_notes: false
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
