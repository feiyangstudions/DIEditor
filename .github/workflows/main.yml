name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 1.2.0（带不带 v 都行）"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: DIEditor
  PROJECT: DIEditor/DIEditor.csproj
  # 必须与 csproj 的 <TargetFramework> 主版本一致：net8.0 → 8.0.x，net9.0 → 9.0.x
  DOTNET_VERSION: "10.0.x"
  # Inno Setup 版本。升版本只改这一行，tag 会自动推导（7.1.1 → is-7_1_1）
  INNO_VERSION: "7.1.1"

jobs:
  # ─────────── 1. 版本号 + 工程定位 ───────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      numversion: ${{ steps.ver.outputs.numversion }}
      tag: ${{ steps.ver.outputs.tag }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
      project: ${{ steps.find.outputs.project }}
      platforms: ${{ steps.find.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RAW="$INPUT_VERSION"
          else
            RAW="$REF_NAME"
          fi

          if [ -z "$RAW" ]; then
            echo "::error::版本号为空"
            exit 1
          fi

          V="${RAW#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

          # 预发布标记：版本号里带 - 或 +
          if [[ "$V" == *-* || "$V" == *+* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          # 剥掉后缀，补成四段，供 VersionInfoVersion / MSBuild 使用
          NUM="${V%%-*}"
          NUM="${NUM%%+*}"
          IFS='.' read -r a b c _rest <<< "$NUM"
          NUMVER="${a:-0}.${b:-0}.${c:-0}.0"
          echo "numversion=$NUMVER" >> "$GITHUB_OUTPUT"

          echo "版本: $V"
          echo "文件版本: $NUMVER"
          echo "预发布: $([[ "$V" == *-* || "$V" == *+* ]] && echo 是 || echo 否)"

      - name: Locate csproj and platforms
        id: find
        shell: bash
        run: |
          set -euo pipefail

          p=""
          for c in "${PROJECT}" "${APP_NAME}/${APP_NAME}.csproj" "${APP_NAME}.csproj"; do
            if [ -n "$c" ] && [ -f "$c" ]; then p="$c"; break; fi
          done

          if [ -z "$p" ]; then
            echo "给定路径不存在，按内容探测 WinUI 主工程..."
            p=$(grep -rl --include='*.csproj' -E 'UseWinUI|WindowsAppSDK' . \
                 | grep -v '/bin/' | grep -v '/obj/' | head -n1 || true)
          fi

          if [ -z "$p" ]; then
            echo "::error::找不到 WinUI 主工程，请修改 env.PROJECT"
            exit 1
          fi

          p="${p#./}"
          echo "project=$p" >> "$GITHUB_OUTPUT"

          props="$(cat "$p")"
          if [ -f Directory.Build.props ]; then
            props="$props$(cat Directory.Build.props)"
          fi
          plats=$(printf '%s' "$props" \
                  | tr -d '\n\r' \
                  | grep -o '<Platforms>[^<]*</Platforms>' \
                  | head -n1 | sed -E 's#</?Platforms>##g' || true)
          echo "platforms=$plats" >> "$GITHUB_OUTPUT"

          echo "主工程: $p"
          echo "Platforms: ${plats:-（未声明，构建时不传 /p:Platform）}"

  # ─────────── 2. 三架构 + 三个安装包 ───────────
  build:
    needs: prepare
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x86
            platform: x86
            app_arch: x86
            inno_arch: x86compatible
          - rid: win-x64
            platform: x64
            app_arch: x64
            inno_arch: x64compatible
          - rid: win-arm64
            platform: ARM64
            app_arch: arm64
            inno_arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Publish ${{ env.APP_NAME }} (${{ matrix.app_arch }})
        shell: pwsh
        env:
          PROJECT: ${{ needs.prepare.outputs.project }}
          PLATFORMS: ${{ needs.prepare.outputs.platforms }}
          NUMVER: ${{ needs.prepare.outputs.numversion }}
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "publish/${{ matrix.rid }}"
          if (Test-Path -LiteralPath $out) { Remove-Item -LiteralPath $out -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $a = @(
            $env:PROJECT,
            "/restore",
            "/t:Publish",
            "/p:Configuration=Release",
            "/p:RuntimeIdentifier=${{ matrix.rid }}",
            "/p:SelfContained=true",
            "/p:WindowsAppSDKSelfContained=true",
            "/p:Version=$env:NUMVER",
            "/p:FileVersion=$env:NUMVER",
            "/p:AssemblyVersion=$env:NUMVER",
            "/p:PublishDir=$out/"
          )

          $declared = @()
          if ($env:PLATFORMS) {
            $declared = @($env:PLATFORMS -split ';' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          }

          if ($declared -contains "${{ matrix.platform }}") {
            $a += "/p:Platform=${{ matrix.platform }}"
            Write-Host "Platform: ${{ matrix.platform }}"
          } else {
            Write-Host "工程未声明 ${{ matrix.platform }}，仅靠 RuntimeIdentifier 决定架构"
          }

          & msbuild @a
          if ($LASTEXITCODE -ne 0) { throw "msbuild publish 失败: ${{ matrix.app_arch }}" }

      - name: Verify output
        shell: pwsh
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE "publish/${{ matrix.rid }}"
          $exe = Join-Path $dir "${env:APP_NAME}.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "找不到 $exe，请核对 AssemblyName" }

          $files = Get-ChildItem -LiteralPath $dir -Recurse -File
          $mb = [math]::Round((($files | Measure-Object Length -Sum).Sum) / 1MB, 1)
          Write-Host "文件数: $($files.Count)，总大小: $mb MB"

          if ($mb -lt 60) {
            Write-Host "::warning::体积偏小，SelfContained 或 WindowsAppSDKSelfContained 可能未生效"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $dir "resources.pri"))) {
            Write-Host "::warning::缺少 resources.pri，界面文字可能显示异常"
          }

      - name: Cache Inno Setup
        uses: actions/cache@v4
        with:
          path: C:\InnoSetup
          key: innosetup-${{ env.INNO_VERSION }}-x64

      - name: Install Inno Setup ${{ env.INNO_VERSION }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dir  = "C:\InnoSetup"
          $iscc = Join-Path $dir "ISCC.exe"
          $want = (($env:INNO_VERSION -split '\.')[0..1] -join '.')
          $tag  = "is-" + ($env:INNO_VERSION -replace '\.', '_')

          function Get-IsccVer([string]$p) {
            if (-not (Test-Path -LiteralPath $p)) { return $null }
            $v = (& $p --version 2>$null | Select-Object -First 1)
            if (-not $v) { $v = (Get-Item -LiteralPath $p).VersionInfo.FileVersion }
            if ($v -and $v -match '(\d+\.\d+(?:\.\d+)?)') { return $Matches[1] }
            return $null
          }

          $ver = Get-IsccVer $iscc
          $got = if ($ver) { ($ver -split '\.')[0..1] -join '.' } else { $null }

          if ($got -eq $want) {
            Write-Host "缓存命中: $iscc (v$ver)"
          } else {
            Write-Host "安装 Inno Setup $env:INNO_VERSION"
            if (Test-Path -LiteralPath $dir) { Remove-Item -LiteralPath $dir -Recurse -Force }

            $url   = "https://github.com/jrsoftware/issrc/releases/download/$tag/innosetup-$env:INNO_VERSION-x64.exe"
            $setup = Join-Path $env:RUNNER_TEMP "innosetup.exe"
            Write-Host "下载 $url"
            Invoke-WebRequest -Uri $url -OutFile $setup -UseBasicParsing

            $fs = [IO.File]::OpenRead($setup)
            try {
              $b = New-Object byte[] 2
              [void]$fs.Read($b, 0, 2)
              if ($b[0] -ne 0x4D -or $b[1] -ne 0x5A) { throw "下载的不是有效 PE，可能被代理拦截返回了 HTML" }
            } finally { $fs.Dispose() }

            $proc = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
              "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$dir"
            )
            if ($proc.ExitCode -ne 0) { throw "安装器退出码 $($proc.ExitCode)" }

            $ver = Get-IsccVer $iscc
            $got = if ($ver) { ($ver -split '\.')[0..1] -join '.' } else { $null }
          }

          if ($got -ne $want) { throw "版本不符：期望 $($want).x，实际 $ver" }

          "ISCC=$iscc" >> $env:GITHUB_ENV
          Write-Host "ISCC: $iscc (v$ver)"

      - name: Build installer (${{ matrix.app_arch }})
        shell: pwsh
        run: |
          & $env:ISCC `
            "/DAppVersion=${{ needs.prepare.outputs.version }}" `
            "/DAppVersion4=${{ needs.prepare.outputs.numversion }}" `
            "/DSourceDir=$env:GITHUB_WORKSPACE\publish\${{ matrix.rid }}" `
            "/DOutputDir=$env:GITHUB_WORKSPACE\dist" `
            "/DAppArch=${{ matrix.app_arch }}" `
            "/DInnoArch=${{ matrix.inno_arch }}" `
            "installer/installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 编译失败: ${{ matrix.app_arch }}" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.app_arch }}
          path: dist/*.exe
          if-no-files-found: error

  # ─────────── 3. x64 单文件便携版 ───────────
  portable:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Publish single-file portable (x64)
        shell: pwsh
        env:
          PROJECT: ${{ needs.prepare.outputs.project }}
          PLATFORMS: ${{ needs.prepare.outputs.platforms }}
          NUMVER: ${{ needs.prepare.outputs.numversion }}
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "publish/portable"
          if (Test-Path -LiteralPath $out) { Remove-Item -LiteralPath $out -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $a = @(
            $env:PROJECT,
            "/restore",
            "/t:Publish",
            "/p:Configuration=Release",
            "/p:RuntimeIdentifier=win-x64",
            "/p:SelfContained=true",
            "/p:WindowsAppSDKSelfContained=true",
            "/p:EnableMsixTooling=true",
            "/p:IncludeAllContentForSelfExtract=true",
            "/p:IncludeNativeLibrariesForSelfExtract=true",
            "/p:PublishSingleFile=true",
            "/p:PublishTrimmed=false",
            "/p:PublishReadyToRun=false",
            "/p:Version=$env:NUMVER",
            "/p:FileVersion=$env:NUMVER",
            "/p:AssemblyVersion=$env:NUMVER",
            "/p:PublishDir=$out/"
          )

          $declared = @()
          if ($env:PLATFORMS) {
            $declared = @($env:PLATFORMS -split ';' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          }
          if ($declared -contains "x64") { $a += "/p:Platform=x64" }

          & msbuild @a
          if ($LASTEXITCODE -ne 0) { throw "单文件发布失败" }

      - name: Stage portable exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE/dist" | Out-Null
          $src = Join-Path $env:GITHUB_WORKSPACE "publish/portable/${env:APP_NAME}.exe"
          if (-not (Test-Path -LiteralPath $src)) { throw "单文件发布没有产出 ${env:APP_NAME}.exe" }

          $dst = "$env:GITHUB_WORKSPACE/dist/${env:APP_NAME}-${{ needs.prepare.outputs.version }}-x64-portable.exe"
          Copy-Item -LiteralPath $src -Destination $dst -Force

          $mb = [math]::Round((Get-Item -LiteralPath $dst).Length / 1MB, 1)
          Write-Host "便携版: $dst ($mb MB)"

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: portable-x64
          path: dist/*.exe
          if-no-files-found: error

  # ─────────── 4. 汇总成草稿 Release ───────────
  release:
    needs: [prepare, build, portable]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List files
        run: |
          ls -lh dist
          count=$(ls dist/*.exe 2>/dev/null | wc -l)
          echo "共 $count 个附件"
          if [ "$count" -ne 4 ]; then
            echo "::warning::期望 4 个附件，实际 $count 个"
          fi

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report result
        if: always()
        shell: bash
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "草稿地址: https://github.com/${{ github.repository }}/releases"
            echo "正式发布: gh release edit ${{ needs.prepare.outputs.tag }} --draft=false"
          else
            echo "::error::Release 创建失败，检查上方日志中的 403 或 unmatched files"
          fi
