name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 1.2.0（带不带 v 都行）"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: DIEditor
  PROJECT: DIEditor/DIEditor.csproj
  # 必须与 csproj 的 <TargetFramework> 主版本一致
  DOTNET_VERSION: "10.0.x"

jobs:
  # ─────────── 1. 版本号 + 工程定位 ───────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      numversion: ${{ steps.ver.outputs.numversion }}
      tag: ${{ steps.ver.outputs.tag }}
      project: ${{ steps.find.outputs.project }}
      platforms: ${{ steps.find.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version }}"
          else
            RAW="${{ github.ref_name }}"
          fi

          if [ -z "$RAW" ]; then
            echo "::error::版本号为空"
            exit 1
          fi

          V="${RAW#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

          NUM="${V%%-*}"
          NUM="${NUM%%+*}"
          IFS='.' read -r a b c <<< "$NUM"
          NUMVER="${a:-0}.${b:-0}.${c:-0}.0"
          echo "numversion=$NUMVER" >> "$GITHUB_OUTPUT"

          echo "版本: $V"
          echo "文件版本: $NUMVER"

      - name: Locate csproj and platforms
        id: find
        shell: bash
        run: |
          set -euo pipefail

          p=""
          for c in "${PROJECT}" "${APP_NAME}/${APP_NAME}.csproj" "${APP_NAME}.csproj"; do
            if [ -n "$c" ] && [ -f "$c" ]; then p="$c"; break; fi
          done

          if [ -z "$p" ]; then
            echo "给定路径不存在，按内容探测 WinUI 主工程..."
            p=$(grep -rl --include='*.csproj' -E 'UseWinUI|WindowsAppSDK' . \
                 | grep -v '/bin/' | grep -v '/obj/' | head -n1 || true)
          fi

          if [ -z "$p" ]; then
            echo "::error::找不到 WinUI 主工程，请修改 env.PROJECT"
            exit 1
          fi

          p="${p#./}"
          echo "project=$p" >> "$GITHUB_OUTPUT"

          props="$(cat "$p")"
          if [ -f Directory.Build.props ]; then
            props="$props$(cat Directory.Build.props)"
          fi
          plats=$(printf '%s' "$props" \
                  | tr -d '\r\n' \
                  | grep -o '<Platforms>[^<]*</Platforms>' \
                  | head -n1 | sed -E 's#</?Platforms>##g' || true)
          echo "platforms=$plats" >> "$GITHUB_OUTPUT"

          echo "主工程: $p"
          echo "Platforms: ${plats:-（未声明，构建时不传 /p:Platform）}"

  # ─────────── 2. 三架构 + 三个安装包 ───────────
  build:
    needs: prepare
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x86
            platform: x86
            app_arch: x86
            inno_arch: x86compatible
          - rid: win-x64
            platform: x64
            app_arch: x64
            inno_arch: x64compatible
          - rid: win-arm64
            platform: ARM64
            app_arch: arm64
            inno_arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Publish ${{ env.APP_NAME }} (${{ matrix.app_arch }})
        shell: pwsh
        env:
          PROJECT: ${{ needs.prepare.outputs.project }}
          PLATFORMS: ${{ needs.prepare.outputs.platforms }}
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "publish/${{ matrix.rid }}"
          if (Test-Path -LiteralPath $out) { Remove-Item -LiteralPath $out -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $a = @(
            $env:PROJECT,
            "/restore",
            "/t:Publish",
            "/p:Configuration=Release",
            "/p:RuntimeIdentifier=${{ matrix.rid }}",
            "/p:SelfContained=true",
            "/p:WindowsAppSDKSelfContained=true",
            "/p:PublishDir=$out/"
          )

          $declared = @()
          if ($env:PLATFORMS) {
            $declared = @($env:PLATFORMS -split ';' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          }

          if ($declared -contains "${{ matrix.platform }}") {
            $a += "/p:Platform=${{ matrix.platform }}"
            Write-Host "Platform: ${{ matrix.platform }}"
          } else {
            Write-Host "工程未声明 ${{ matrix.platform }}，仅靠 RuntimeIdentifier 决定架构"
          }

          & msbuild @a
          if ($LASTEXITCODE -ne 0) { throw "msbuild publish 失败: ${{ matrix.app_arch }}" }

      - name: Verify output
        shell: pwsh
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE "publish/${{ matrix.rid }}"
          $exe = Join-Path $dir "${env:APP_NAME}.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "找不到 $exe，请核对 AssemblyName" }

          $files = Get-ChildItem -LiteralPath $dir -Recurse -File
          $mb = [math]::Round((($files | Measure-Object Length -Sum).Sum) / 1MB, 1)
          Write-Host "文件数: $($files.Count)，总大小: $mb MB"

          if ($mb -lt 60) {
            Write-Host "::warning::体积偏小，SelfContained 或 WindowsAppSDKSelfContained 可能未生效"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $dir "resources.pri"))) {
            Write-Host "::warning::缺少 resources.pri，界面文字可能显示异常"
          }

      - name: Cache Inno Setup
        uses: actions/cache@v4
        with:
          path: C:\InnoSetup
          key: innosetup-${{ runner.os }}-v2

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dir  = "C:\InnoSetup"
          $iscc = Join-Path $dir "ISCC.exe"

          function Find-Iscc {
            $c = @($iscc)
            $c += (Get-ChildItem "$env:ProgramFiles\Inno Setup*\ISCC.exe"          -ErrorAction SilentlyContinue).FullName
            $c += (Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe"   -ErrorAction SilentlyContinue).FullName
            $c += (Get-ChildItem "$env:LOCALAPPDATA\Programs\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue).FullName
            $c | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          }

          function Test-PEFile {
            param([string]$Path)
            if (-not (Test-Path -LiteralPath $Path)) { return $false }
            if ((Get-Item -LiteralPath $Path).Length -lt 1MB) { return $false }
            $fs = [IO.File]::OpenRead($Path)
            try {
              $b = New-Object byte[] 2
              [void]$fs.Read($b, 0, 2)
              return ($b[0] -eq 0x4D -and $b[1] -eq 0x5A)
            } finally { $fs.Dispose() }
          }

          $hit = Find-Iscc
          if ($hit) { Write-Host "缓存命中: $hit" }

          if (-not $hit) {
            Write-Host "尝试 winget 安装..."
            & winget install --id JRSoftware.InnoSetup --exact --silent `
                --accept-package-agreements --accept-source-agreements `
                --disable-interactivity
            Write-Host "winget 退出码: $LASTEXITCODE"
            $hit = Find-Iscc
          }

          if (-not $hit) {
            Write-Host "从 GitHub Releases 获取官方安装包..."
            $headers = @{ "User-Agent" = "DIEditor-CI"; "Accept" = "application/vnd.github+json" }
            $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/jrsoftware/issrc/releases/latest" -Headers $headers

            $asset = $rel.assets | Where-Object { $_.name -match '^innosetup-[\d.]+-x64\.exe$' } | Select-Object -First 1
            if (-not $asset) {
              $asset = $rel.assets | Where-Object { $_.name -match '^innosetup-[\d.]+\.exe$' } | Select-Object -First 1
            }
            if (-not $asset) { throw "在 $($rel.tag_name) 中未找到 innosetup 安装包资源" }

            $setup = Join-Path $env:RUNNER_TEMP "innosetup.exe"
            Write-Host "下载 $($asset.name)（$([math]::Round($asset.size/1MB,1)) MB）"
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $setup -UseBasicParsing

            if (-not (Test-PEFile -Path $setup)) {
              $kb = [math]::Round((Get-Item -LiteralPath $setup).Length / 1KB, 1)
              throw "下载的文件不是有效 PE（$kb KB），大概率被代理拦截后返回了 HTML 页面"
            }

            $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
              "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$dir"
            )
            Write-Host "安装器退出码: $($p.ExitCode)"
            $hit = Find-Iscc
          }

          if (-not $hit) { throw "Inno Setup 安装失败，任何位置都没有可用 ISCC.exe" }

          "ISCC=$hit" >> $env:GITHUB_ENV
          Write-Host "ISCC: $hit"
          Write-Host "大小: $([math]::Round((Get-Item -LiteralPath $hit).Length / 1MB, 2)) MB"

      - name: Build installer (${{ matrix.app_arch }})
        shell: pwsh
        run: |
          & $env:ISCC `
            "/DAppVersion=${{ needs.prepare.outputs.version }}" `
            "/DAppVersion4=${{ needs.prepare.outputs.numversion }}" `
            "/DSourceDir=$env:GITHUB_WORKSPACE\publish\${{ matrix.rid }}" `
            "/DOutputDir=$env:GITHUB_WORKSPACE\dist" `
            "/DAppArch=${{ matrix.app_arch }}" `
            "/DInnoArch=${{ matrix.inno_arch }}" `
            "installer/installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 编译失败: ${{ matrix.app_arch }}" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.app_arch }}
          path: dist/*.exe
          if-no-files-found: error

  # ─────────── 3. x64 单文件便携版 ───────────
  portable:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Publish single-file portable (x64)
        shell: pwsh
        env:
          PROJECT: ${{ needs.prepare.outputs.project }}
          PLATFORMS: ${{ needs.prepare.outputs.platforms }}
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "publish/portable"
          if (Test-Path -LiteralPath $out) { Remove-Item -LiteralPath $out -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $a = @(
            $env:PROJECT,
            "/restore",
            "/t:Publish",
            "/p:Configuration=Release",
            "/p:RuntimeIdentifier=win-x64",
            "/p:SelfContained=true",
            "/p:WindowsAppSDKSelfContained=true",
            "/p:EnableMsixTooling=true",
            "/p:IncludeAllContentForSelfExtract=true",
            "/p:IncludeNativeLibrariesForSelfExtract=true",
            "/p:PublishSingleFile=true",
            "/p:PublishTrimmed=false",
            "/p:PublishReadyToRun=false",
            "/p:PublishDir=$out/"
          )

          $declared = @()
          if ($env:PLATFORMS) {
            $declared = @($env:PLATFORMS -split ';' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          }
          if ($declared -contains "x64") { $a += "/p:Platform=x64" }

          & msbuild @a
          if ($LASTEXITCODE -ne 0) { throw "单文件发布失败" }

      - name: Stage portable exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE/dist" | Out-Null
          $src = Join-Path $env:GITHUB_WORKSPACE "publish/portable/${env:APP_NAME}.exe"
          if (-not (Test-Path -LiteralPath $src)) { throw "单文件发布没有产出 ${env:APP_NAME}.exe" }

          $dst = "$env:GITHUB_WORKSPACE/dist/${env:APP_NAME}-${{ needs.prepare.outputs.version }}-x64-portable.exe"
          Copy-Item -LiteralPath $src -Destination $dst -Force

          $mb = [math]::Round((Get-Item -LiteralPath $dst).Length / 1MB, 1)
          Write-Host "便携版: $dst ($mb MB)"

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: portable-x64
          path: dist/*.exe
          if-no-files-found: error

  # ─────────── 4. 汇总成草稿 Release ───────────
  release:
    needs: [prepare, build, portable]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List files
        run: |
          ls -lh dist
          count=$(ls dist/*.exe 2>/dev/null | wc -l)
          echo "共 $count 个附件"
          if [ "$count" -ne 4 ]; then
            echo "::warning::期望 4 个附件，实际 $count 个"
          fi

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: false
          generate_release_notes: false
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
